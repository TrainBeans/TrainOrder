spring.application.name=TrainOrder

# H2 file-based database (data persists across restarts)
spring.datasource.url=jdbc:h2:file:./data/trainorderdb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console available at http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:file:./data/trainorderdb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Run schema.sql on every startup
spring.sql.init.mode=always

# Actuator
management.endpoints.web.exposure.include=health,info
